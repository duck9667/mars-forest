<html lang="ko">
<head>

<title>화성 물병 가게</title>
<style>
:root{--ink:#1f120d;--coral:#e9775c;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#e8763a}
body{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Helvetica Neue",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.lb{position:absolute;transform:translate(-50%,-100%);background:#fff;border:1.5px solid var(--ink);padding:2px 7px;font-size:11px;font-weight:700;white-space:nowrap;letter-spacing:.01em;border-radius:3px}
.lb.pad{background:#fff6d0;border-color:#c98a00;color:#5a3a00;font-size:10.5px}
.lb.pad.ok{background:#ffe27a;color:var(--ink);border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.lb.bub{background:#fff;border-width:2px;padding:3px 9px;font-size:13px;border-radius:12px;font-weight:800}
.lb.bub::after{content:"";position:absolute;left:50%;top:100%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ink)}
.lb.bub.hot{background:#ffe3dc;border-color:#c23b2a}
.lb.cash{background:#dfffd0;border-color:#2e7d32;color:#1b5e20}
.fl{position:absolute;transform:translate(-50%,-100%);font-weight:900;font-size:16px;color:#fff;white-space:nowrap;text-shadow:1px 1px 0 var(--ink),-1px 1px 0 var(--ink),1px -1px 0 var(--ink),-1px -1px 0 var(--ink)}
.fl.gold{color:#ffe27a}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(8px + var(--sat)) 10px 0;display:flex;gap:6px;align-items:center;pointer-events:none;z-index:2}
.pill{background:#fff;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);padding:5px 10px;font-size:13px;font-weight:800;white-space:nowrap}
#bells{font-size:17px;padding:6px 12px;transition:transform .12s}
#bells.flash{transform:scale(1.12);background:#fff6d0}
#sub{font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.35);margin-left:2px}
#gear{margin-left:auto;pointer-events:auto;cursor:pointer;padding:5px 9px}
#hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(54px + var(--sat));background:var(--ink);color:#fff;padding:6px 14px;font-size:13px;font-weight:700;border-radius:20px;white-space:nowrap;z-index:2;pointer-events:none;transition:opacity .3s;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}
#hint:empty{opacity:0}
#joy{position:fixed;left:0;top:0;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(31,18,13,.35);display:none;pointer-events:none;transform:translate(-60px,-60px);z-index:3}
#joy.on{display:block}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fff;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.modal{position:fixed;inset:0;background:rgba(31,18,13,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.on{display:flex}
.box{background:#fff;border:2px solid var(--ink);padding:18px 18px 16px;width:100%;max-width:360px;box-shadow:6px 6px 0 var(--ink)}
.box h1{margin:0 0 6px;font-size:22px;letter-spacing:.1em;font-weight:900}
.box h2{margin:0 0 8px;font-size:15px;letter-spacing:.08em;font-weight:800}
.box p{margin:0 0 12px;font-size:13px;color:#555;line-height:1.6}
.box .big{font-size:30px;font-weight:900;text-align:center;margin:8px 0 14px}
.btn{display:block;width:100%;background:var(--ink);color:#fff;border:2px solid var(--ink);padding:12px;font:inherit;font-size:14px;font-weight:800;letter-spacing:.06em;cursor:pointer;margin-top:8px}
.btn.o{background:var(--coral)}.btn.g{background:#fff;color:var(--ink)}
.btn:active{transform:translate(1px,1px)}
#toast{position:fixed;left:50%;bottom:calc(120px + var(--sab));transform:translateX(-50%);background:#fff;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:6px 14px;font-size:13px;font-weight:700;opacity:0;transition:opacity .25s;z-index:4;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;letter-spacing:.1em;z-index:30;background:#e8763a}
</style>
</head>

<div class="modal on" id="intro"><div class="box"><h1>화성 물병 가게</h1><p>붉은 행성 광장에서 물병 가게를 열어요. 얼음을 녹여 물병을 만들고, 여행자에게 팔아 벨을 모으고, 발판을 밟아 가게를 키워요.<br>화면을 드래그하면 걸어요. 나머지는 가까이 가면 알아서 돼요.</p><button class="btn" id="start">가게 열기</button></div></div>

function itemMesh(k){if(k==='ice'){const m=mesh(G.oct(5.5),COL.ice,0,0,0,{roughness:.2,emissive:0x8fd0ff,emissiveIntensity:.35});m.scale.y=1.4;return m}const g=new THREE.Group();g.add(mesh(G.cyl(3.6,3.6,10,8),COL.blueL,0,5,0,{roughness:.2}));g.add(mesh(G.cyl(2,2,3,8),COL.dark,0,11.5,0));return g}
const ITEM_H={ice:12,bottle:13};
function syncStack(group,list,key){if(group.userData.key===key)return;group.userData.key=key;while(group.children.length)group.remove(group.children[0]);list.forEach((k,i)=>{const m=itemMesh(k);m.position.y=list.slice(0,i).reduce((a,kk)=>a+ITEM_H[kk],0);m.userData.k=k;group.add(m)})}
function stackSway(group,vel,dt,an){const tx=clamp(-vel[0]*.9,-9,9),tz=clamp(-vel[1]*.9,-9,9);an.swx=lerp(an.swx||0,tx,Math.min(1,dt*7));an.swz=lerp(an.swz||0,tz,Math.min(1,dt*7));group.children.forEach((m,i)=>{m.position.x=an.swx*i*.18;m.position.z=an.swz*i*.18;m.rotation.z=an.swx*.012*i;m.rotation.x=-an.swz*.012*i})}

const flying=[];
function fly(kind,from,to,dur=.35,onDone){let m;if(kind==='coin'){m=mesh(G.cyl(4,4,1.5,10),COL.gold,0,0,0,{emissive:0xffd34d,emissiveIntensity:.6});m.rotation.x=Math.PI/2}else m=itemMesh(kind);world.add(m);flying.push({m,from,to,t:0,dur,onDone})}
function tickFlying(dt){for(let i=flying.length-1;i>=0;i--){const f=flying[i];f.t+=dt;const k=Math.min(1,f.t/f.dur),e=1-Math.pow(1-k,2);const x=lerp(f.from.x,f.to.x,e),y=lerp(f.from.y,f.to.y,e),h=lerp(f.from.h,f.to.h,e)+Math.sin(k*Math.PI)*45;f.m.position.copy(W2T(x,y,h));f.m.rotation.y+=dt*8;if(k>=1){world.remove(f.m);flying.splice(i,1);if(f.onDone)f.onDone()}}}
const pops=[]; // {g,t} 스케일 바운스

function tickPops(dt){for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.t+=dt;const k=Math.min(1,p.t/.5);const s=lerp(p.from,1,easeOutBack(k));p.g.scale.setScalar(s);if(k>=1){p.g.scale.setScalar(1);pops.splice(i,1)}}}
const rings=[];function ringFx(x,y,col=COL.gold){const m=new THREE.Mesh(G.tor(20,2.5),new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.8,transparent:true,flatShading:true}));m.rotation.x=Math.PI/2;m.castShadow=false;m.position.copy(W2T(x,y,2));world.add(m);rings.push({m,t:0})}

/* ================= 플레이어 상호작용 (근접 자동) ================= */
let actT=0;
function nearStn(k,r){const s=STN[k],p=S.p;return Math.abs(p.x-s.x)<s.w/2+r&&Math.abs(p.y-s.y)<s.h/2+r}
function stackTop(list){return 66+list.reduce((a,k)=>a+ITEM_H[k],0)}
function interact(dt){actT-=dt;if(actT>0)return;const p=S.p,c=p.carry;
  if(c.length<carryMax()&&!(c.length&&c[0]!=='ice')){for(let i=0;i<ICE_SPOTS.length;i++){if(S.spots[i]>0)continue;const [x,y]=ICE_SPOTS[i];if(Math.hypot(p.x-x,p.y-y)<34){S.spots[i]=14+Math.random()*6;const ig=iceG[i];ig.userData.s=0;ig.scale.setScalar(.001);
      fly('ice',{x,y,h:8},{x:p.x,y:p.y,h:stackTop(c)},.3,()=>{c.push('ice');sfx('pick')});actT=.16;return}}}
  if(c.length&&c[c.length-1]==='ice'&&nearStn('melter',36)){c.pop();const s=STN.melter;fly('ice',{x:p.x,y:p.y,h:stackTop(c)},{x:s.x,y:s.y,h:70},.3,()=>{S.meltQ++;sfx('put')});actT=.13;return}
  if(S.bottles>0&&c.length<carryMax()&&!(c.length&&c[0]!=='bottle')&&nearStn('bottler',36)){S.bottles--;const s=STN.bottler;fly('bottle',{x:s.x,y:s.y+32,h:6},{x:p.x,y:p.y,h:stackTop(c)},.3,()=>{c.push('bottle');sfx('pick')});actT=.13;return}
  if(c.length&&c[c.length-1]==='bottle'&&S.shelf<shelfCap()&&nearStn('counter',46)&&p.y<STN.counter.y){c.pop();const s=STN.counter;const i=S.shelf;S.shelf++;fly('bottle',{x:p.x,y:p.y,h:stackTop(c)},{x:s.x-84+(i%12)*15,y:s.y-8+Math.floor(i/12)*14,h:36},.28,()=>sfx('put'));actT=.11;return}
  if(S.cash>0&&nearStn('register',50)){const n=S.cash;S.cash=0;const s=STN.register;const cnt=Math.min(10,Math.ceil(n/12));for(let i=0;i<cnt;i++)setTimeout(()=>fly('coin',{x:s.x+30,y:s.y+6,h:10+i*2},{x:S.p.x,y:S.p.y,h:40},.4,()=>{S.bells+=n/cnt;flashBells();sfx('coin')}),i*45);floatTxt(s.x+20,s.y,`+${n}`,true);actT=.25;return}
}

let padCoinT=0;
function tickPads(dt){const p=S.p;padCoinT-=dt;for(const pd of PADS){const lv=padLv(pd.id);if(lv>=pd.max||!pd.req(S))continue;if(Math.hypot(p.x-pd.x,p.y-pd.y)>30)continue;
  const cost=pd.cost(lv);let prog=S.padProg[pd.id]||0;if(prog>=cost)continue;const take=Math.min(S.bells,cost-prog,Math.max(3,cost*dt*1.1));if(take<=0)continue;
  S.bells-=take;prog+=take;S.padProg[pd.id]=prog;if(padCoinT<=0){padCoinT=.08;fly('coin',{x:p.x,y:p.y,h:50},{x:pd.x,y:pd.y,h:4},.25);sfx('pad')}
  if(prog>=cost){S.pads[pd.id]=lv+1;S.padProg[pd.id]=0;sfx('up');ringFx(pd.x,pd.y);toast(`✨ ${pd.n} ${pd.max>1?'Lv.'+(lv+1):'완료'}`);onPad(pd.id);save()}}}
function onPad(id){if(id==='cashier'){const b={k:'cashier',x:STN.register.x+36,y:STN.register.y+2,dir:[0,-1]};bots.push(b);const g=bRobot(0x9aa7b2);g.position.copy(W2T(b.x,b.y));world.add(g);botG.push(g);b.g=g;pop(g)}
  if(id==='runner'||id==='runner2'){const b=mkRunner();bots.push(b);const g=bRobot();g.position.copy(W2T(b.x,b.y));world.add(g);botG.push(g);b.g=g;pop(g)}
  if(id==='drill')pop(stnG.drill);if(id==='dome')pop(domeG)}
function mkRunner(){return{k:'runner',x:STN.bottler.x-50,y:STN.bottler.y+20,carry:0,st:'toBottler',t:0,dir:[0,1]}}

function tickMachines(dt){
  if(S.meltQ>0){S.meltT+=dt;if(S.meltT>=meltTime()){S.meltT=0;S.meltQ--;S.water+=10}}else S.meltT=0;
  if(S.water>=10&&S.bottles<6){S.botT+=dt;if(S.botT>=bottleTime()){S.botT=0;S.water-=10;S.bottles++;const s=STN.bottler;fly('bottle',{x:s.x+22,y:s.y+20,h:24},{x:s.x-20+((S.bottles-1)%6)*8,y:s.y+32,h:6},.3)}}else S.botT=0;
  for(let i=0;i<S.spots.length;i++)if(S.spots[i]>0){S.spots[i]=Math.max(0,S.spots[i]-dt);if(S.spots[i]===0){iceG[i].userData.s=1;pop(iceG[i],.2)}}
  if(padLv('drill')){S.drillT=(S.drillT||0)+dt;if(S.drillT>=2.5){S.drillT=0;if(S.meltQ<12){const d=STN.drill,m=STN.melter;fly('ice',{x:d.x,y:d.y+10,h:30},{x:m.x,y:m.y,h:70},.6,()=>{S.meltQ++})}}}
}
/* ================= 손님 ================= */
function tickCustomers(dt){S.spawnT-=dt;const inQ=custs.filter(c=>c.st==='queue'||c.st==='walkin');
  if(S.spawnT<=0&&inQ.length<6){S.spawnT=spawnGap()*(.7+Math.random()*.6);custs.push({id:uid++,x:ENTRY.x+(Math.random()-.5)*60,y:ENTRY.y,st:'walkin',want:1+(Math.random()<.4?1:0)+(Math.random()<.15?1:0),col:[0x6fb1e0,0xf2c14e,0x9bd36b,0xe88cc0,0xc49bf0][Math.random()*5|0],wait:0,t:0,dir:[0,-1]})}
  const q=custs.filter(c=>c.st==='walkin'||c.st==='queue');q.sort((a,b)=>a.id-b.id);q.forEach((c,i)=>{c.tx=QUEUE_X;c.ty=QUEUE_Y0+i*QUEUE_GAP;c.qi=i});
  const cashier=bots.some(b=>b.k==='cashier'),playerAtReg=nearStn('register',70);
  for(const c of custs){c.t+=dt;
    if(c.st==='walkin'||c.st==='queue'){const d=moveTo(c,c.tx,c.ty,110*dt);if(d<2){c.st='queue';c.dir=[0,-1]}else if(c.st==='queue')c.st='walkin';
      if(c.st==='queue'&&c.qi===0){c.wait+=dt;if(S.shelf>=c.want&&(cashier||playerAtReg)){c.pay=(c.pay||0)+dt;if(c.pay>=.45){S.shelf-=c.want;const earn=bottlePrice()*c.want;S.cash+=earn;S.sold+=c.want;S.custs++;sfx('sell');c.jump=0;
            for(let i=0;i<c.want;i++)fly('bottle',{x:STN.counter.x-84+((S.shelf+i)%12)*15,y:STN.counter.y-8,h:36},{x:c.x,y:c.y,h:50},.3);floatTxt(STN.register.x+20,STN.register.y-10,`+${earn}`,true);
            c.served=1;if(padLv('dome')&&freeSeat()){c.st='toSeat';const s=freeSeat();s.used=c.id;c.seat=s;c.tx=s.x;c.ty=s.y}else{c.st='leave';c.tx=ENTRY.x-60;c.ty=ENTRY.y}}}
        else if(c.wait>40){c.st='leave';c.angry=true;c.tx=ENTRY.x+60;c.ty=ENTRY.y;floatTxt(c.x,c.y-20,'💢');S.lost=(S.lost||0)+1}}}
    else if(c.st==='toSeat'){if(moveTo(c,c.tx,c.ty,110*dt)<2){c.st='sit';c.sitT=5+Math.random()*3;c.dir=[0,1]}}
    else if(c.st==='sit'){c.sitT-=dt;if(c.sitT<=0){c.st='leave';const tip=Math.round(bottlePrice()*.5);c.seat.tip=(c.seat.tip||0)+tip;c.seat.used=0;c.seat.mesh.visible=true;c.tx=ENTRY.x-60;c.ty=ENTRY.y}}
    else if(c.st==='leave'){if(moveTo(c,c.tx,c.ty,120*dt)<3)c.st='gone'}
    if(c.jump!==undefined){c.jump+=dt;if(c.jump>.5)c.jump=undefined}}
  custs=custs.filter(c=>c.st!=='gone');
  for(const s of seats)if(s.tip&&Math.hypot(S.p.x-s.x,S.p.y-s.y)<34){const n=s.tip;s.tip=0;s.mesh.visible=false;fly('coin',{x:s.x+12,y:s.y-8,h:4},{x:S.p.x,y:S.p.y,h:40},.35,()=>{S.bells+=n;flashBells();sfx('coin')});floatTxt(s.x,s.y-10,`+${n}`,true)}
}
function moveTo(e,tx,ty,sp){const dx=tx-e.x,dy=ty-e.y,L=Math.hypot(dx,dy);if(L<.5)return 0;const m=Math.min(sp,L);e.x+=dx/L*m;e.y+=dy/L*m;e.dir=[dx/L,dy/L];e.moving=true;return L-m}
/* ================= 로봇 ================= */
function tickBots(dt){for(const b of bots){b.moving=false;if(b.k!=='runner')continue;const sp=runnerSpd()*dt;
  if(b.st==='toBottler'){if(moveTo(b,STN.bottler.x-52,STN.bottler.y+10,sp)<2){b.st='load';b.t=0}}
  else if(b.st==='load'){b.t+=dt;if(S.bottles>0&&b.carry<4&&b.t>.25){b.t=0;S.bottles--;b.carry++;const s=STN.bottler;fly('bottle',{x:s.x-20,y:s.y+32,h:6},{x:b.x,y:b.y,h:50},.25)}if(b.carry>=4||(b.carry>0&&S.bottles===0&&b.t>1.5))b.st='toCounter'}
  else if(b.st==='toCounter'){if(moveTo(b,STN.counter.x-40,STN.counter.y-34,sp)<2){b.st='unload';b.t=0}}
  else if(b.st==='unload'){b.t+=dt;if(b.carry>0&&S.shelf<shelfCap()&&b.t>.2){b.t=0;b.carry--;const i=S.shelf;S.shelf++;fly('bottle',{x:b.x,y:b.y,h:50},{x:STN.counter.x-84+(i%12)*15,y:STN.counter.y-8+Math.floor(i/12)*14,h:36},.25,()=>sfx('put'))}if(b.carry===0||(S.shelf>=shelfCap()&&b.t>1.2))b.st='toBottler'}}}
/* ================= 부재 중 수익 ================= */
function offlineEarn(){const el=(Date.now()-(S.savedAt||Date.now()))/1000;if(el<60||!padLv('cashier')||!padLv('runner'))return;
  const secs=Math.min(el,2*3600);const rate=Math.min(1/bottleTime(),(1/spawnGap())*1.4)*bottlePrice()*.5;const n=Math.round(secs*rate);if(n<10)return;
  S.bells+=n;$('#offtxt').textContent=`${Math.round(secs/60)}분 동안 삐걱과 뽀삐가 가게를 봤어요 (최대 2시간)`;$('#offamt').textContent=`+${n} 🔔`;$('#offline').classList.add('on');save()}
$('#offok').onclick=()=>{$('#offline').classList.remove('on');sfx('coin')};
/* ================= 힌트 ================= */
let hintTarget=null;
function hint(){const c=S.p.carry,s=S;let t='',tg=null;const ice=c.length&&c[0]==='ice',bot=c.length&&c[0]==='bottle';
  if(ice&&c.length>=Math.min(carryMax(),3)){t='제빙기에 얼음을 넣어요';tg=STN.melter}

    else if(s.meltQ>0||s.water>=10){t='물병이 만들어지는 중…';tg=STN.bottler}}

const arrowG=new THREE.Group();{const c=mesh(G.cone(7,16,8),COL.white,0,0,0,{emissive:0xffffff,emissiveIntensity:.3});c.rotation.x=Math.PI/2;c.castShadow=false;arrowG.add(c);const s=mesh(G.cyl(3,3,10,6),COL.white,0,0,-12);s.rotation.x=Math.PI/2;s.castShadow=false;arrowG.add(s);world.add(arrowG)}
const targetRing=mesh(G.tor(26,1.8),COL.white,0,1.5,0,{emissive:0xffffff,emissiveIntensity:.6});targetRing.rotation.x=Math.PI/2;targetRing.castShadow=false;world.add(targetRing);
/* ================= 입력: 플로팅 조이스틱 ================= */
let joy=null,joyVec=null;const joyEl=$('#joy'),knob=$('#knob');
canvas.addEventListener('pointerdown',e=>{if($('#intro').classList.contains('on'))return;if(joy)return;canvas.setPointerCapture(e.pointerId);joy={id:e.pointerId,x:e.clientX,y:e.clientY};joyEl.style.left=e.clientX+'px';joyEl.style.top=e.clientY+'px';joyEl.classList.add('on');knob.style.left='35px';knob.style.top='35px';joyVec=null});

const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1});addEventListener('keyup',e=>{delete keys[e.key.toLowerCase()]});
function inputVec(){let x=0,y=0;if(keys.arrowleft||keys.a)x-=1;if(keys.arrowright||keys.d)x+=1;if(keys.arrowup||keys.w)y-=1;if(keys.arrowdown||keys.s)y+=1;if(x||y){const L=Math.hypot(x,y);return[x/L,y/L]}return joyVec}
/* ================= 충돌 ================= */
function blocked(x,y){if(x<16||x>W-16||y<60||y>H-16)return true;for(const k in STN){if(k==='drill'&&!padLv('drill'))continue;const s=STN[k];if(Math.abs(x-s.x)<s.w/2+10&&Math.abs(y-s.y)<s.h/2+8)return true}if(padLv('dome')){for(const s of seats)if(Math.hypot(x-s.x,y-s.y)<16)return true}return false}
/* ================= 업데이트 ================= */
let walking=false,animT=0,vel=[0,0],hintT=0,saveT=0;
function update(dt){const p=S.p,v=inputVec();walking=false;const ox=p.x,oy=p.y;
  if(v){const sp=165*dt;const nx=p.x+v[0]*sp,ny=p.y+v[1]*sp;if(!blocked(nx,p.y))p.x=nx;if(!blocked(p.x,ny))p.y=ny;p.dir=v;walking=true;animT+=dt}

  interact(dt);tickMachines(dt);tickCustomers(dt);tickBots(dt);tickPads(dt);tickFlying(dt);tickPops(dt);tickRings(dt);
  floats.forEach(f=>f.t+=dt);floats=floats.filter(f=>f.t<1.1);
  const vh=viewH();cam.y=lerp(cam.y,clamp(p.y+vh*.04,vh*.42,H-vh*.55),Math.min(1,dt*6));cam.x=200;updateCamera();
  hintT+=dt;if(hintT>.3){hintT=0;hint();renderHud()}
  saveT+=dt;if(saveT>3){saveT=0;save()}}
function renderHud(){$('#bells').textContent=`🔔 ${Math.floor(S.bells)}`;$('#sub').textContent=`판매 ${S.sold} · 🎒 ${S.p.carry.length}/${carryMax()}`}
/* ================= 렌더 동기화 ================= */
const yaw=d=>Math.atan2(-d[1],d[0]);
function animPerson(g,moving,dt,t,ph){const an=g.userData.anim;if(!an)return;const sw=moving?Math.sin(t/95+ph)*.95:0;if(an.lL){an.lL.rotation.x=sw;an.lR.rotation.x=-sw;an.aL.rotation.x=-sw*.8;an.aR.rotation.x=sw*.8}
  if(an.body){an.body.position.y=(an.lL?24:19)+(moving?Math.abs(Math.sin(t/95+ph))*2:Math.sin(t/600+ph)*.8)}
  g.rotation.x=moving?.12:0}
const labelsEl=$('#labels');let labelHtml='';
function tagAt(txt,x,y,h,cls=''){const s=toScreen(x,y,h);if(s.x<-120||s.x>VW+120||s.y<-60||s.y>VH+60)return;const sx=cls.includes('pad')?clamp(s.x,88,VW-88):s.x;labelHtml+=`<div class="${cls}" style="left:${sx}px;top:${s.y}px">${txt}</div>`}
const cashHeight=()=>Math.min(12,Math.ceil(S.cash/12))*1.8;

  // 플레이어
  playerG.position.copy(W2T(S.p.x,S.p.y,walking?Math.abs(Math.sin(t/95))*2.5:0));playerG.rotation.y=yaw(S.p.dir)-Math.PI/2;animPerson(playerG,walking,dt,t,0);
  const pa=playerG.userData.anim;syncStack(pa.carry,S.p.carry,S.p.carry.join(','));
  {const d=S.p.dir,lv=[vel[0]*d[0]+vel[1]*d[1],-vel[0]*d[1]+vel[1]*d[0]];stackSway(pa.carry,[lv[1]*.06,lv[0]*.06],dt,pa)} // 로컬 좌표로 변환
  // 로봇
  for(const b of bots){if(!b.g)continue;b.g.position.copy(W2T(b.x,b.y,b.moving?Math.abs(Math.sin(t/90))*2:0));if(b.dir)b.g.rotation.y=yaw(b.dir)-Math.PI/2;const an=b.g.userData.anim;if(b.k==='runner'){syncStack(an.carry,Array(b.carry).fill('bottle'),'b'+b.carry);stackSway(an.carry,[0,b.moving?-4:0],dt,an)}else{b.g.position.y=Math.sin(t/500)*.8}}
  // 손님
  {const seen=new Set();for(const c of custs){seen.add(c.id);let g=custG.get(c.id);if(!g){g=bTraveler(c.col);world.add(g);custG.set(c.id,g);pop(g,.4)}
      const jump=c.jump!==undefined?Math.sin(c.jump/.5*Math.PI)*18:0;const bob=c.moving?Math.abs(Math.sin(t/100+c.id))*2.5:(c.st==='queue'?Math.sin(t/450+c.id)*1:0);g.position.copy(W2T(c.x,c.y,jump+bob));g.rotation.y=yaw(c.dir)-Math.PI/2;animPerson(g,!!c.moving,dt,t,c.id);c.moving=false;if(c.st==='sit')g.position.y-=4}
    for(const [id,g] of custG)if(!seen.has(id)){world.remove(g);custG.delete(id)}}
  // 기계 상태
  {const m=stnG.melter;const q=m.userData.q;syncStack(q,Array(Math.min(S.meltQ,5)).fill('ice'),'i'+Math.min(S.meltQ,5));m.userData.bar.scale.x=S.meltQ>0?Math.max(.02,S.meltT/meltTime()):.02;m.userData.bar.position.x=-20+20*m.userData.bar.scale.x;
    const b=stnG.bottler;const o=b.userData.out;if(o.userData.n!==S.bottles){o.userData.n=S.bottles;while(o.children.length)o.remove(o.children[0]);for(let i=0;i<S.bottles;i++){const im=itemMesh('bottle');im.position.set(-20+i*8,0,0);o.add(im)}}b.userData.bar.scale.x=S.water>=10?Math.max(.02,S.botT/bottleTime()):.02;b.userData.bar.position.x=-20+20*b.userData.bar.scale.x;
    const sh=stnG.counter.userData.shelf;if(sh.userData.n!==S.shelf){sh.userData.n=S.shelf;while(sh.children.length)sh.remove(sh.children[0]);for(let i=0;i<S.shelf;i++){const im=itemMesh('bottle');im.position.set(-84+(i%12)*15,0,-8+Math.floor(i/12)*14);sh.add(im)}}
    const cg=stnG.register.userData.cash;const n=S.cash>0?Math.min(12,Math.ceil(S.cash/12)):0;if(cg.userData.n!==n){cg.userData.n=n;while(cg.children.length)cg.remove(cg.children[0]);for(let i=0;i<n;i++){const bill=mesh(G.box(16,1.6,10),COL.green,(Math.random()-.5)*2,1+i*1.8,(Math.random()-.5)*2);bill.rotation.y=(Math.random()-.5)*.4;cg.add(bill)}}
    if(stnG.drill.visible){stnG.drill.userData.drill.rotation.y+=.3;stnG.drill.userData.drill.position.y=28+Math.sin(t/120)*4}}
