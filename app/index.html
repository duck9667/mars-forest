<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#c9552b">
<title>화성 물병 가게</title>
<style>
:root{--ink:#1a1210;--navy:#15213a;--navy2:#1f3157;--line:#3b4f7a;--blueD:#0f3f99;--gold:#ffd45a;--goldD:#a06400;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#c9552b}
body{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Helvetica Neue",sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
/* ---- 아이콘 (CSS SVG) ---- */
.ic{display:inline-block;width:14px;height:14px;background:center/contain no-repeat;vertical-align:-2px;flex:none}
.ic.bell{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2a2 2 0 0 1 2 2v1a6 6 0 0 1 4 5.7V15l2 2v1H4v-1l2-2v-4.3A6 6 0 0 1 10 5V4a2 2 0 0 1 2-2z' fill='%23ffc83d' stroke='%23a06400' stroke-width='1.6' stroke-linejoin='round'/><circle cx='12' cy='20' r='2' fill='%23a06400'/></svg>")}
.ic.ice{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='3' y='3' width='18' height='18' rx='4' fill='%23bfe6ff' stroke='%235a9ccc' stroke-width='1.8'/><path d='M7 9l3-3M7 14l7-7' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/></svg>")}
.ic.bottle{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='9' y='1.5' width='6' height='4' rx='1' fill='%23274060'/><path d='M8 6h8v3l1.5 2v10.5a1.5 1.5 0 0 1-1.5 1.5H8a1.5 1.5 0 0 1-1.5-1.5V11L8 9z' fill='%2366c1f5' stroke='%232a78b0' stroke-width='1.6' stroke-linejoin='round'/><path d='M9.5 12v7' stroke='%23fff' stroke-width='2' stroke-linecap='round'/></svg>")}
.ic.drop{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2.5c3 4.5 7 8.5 7 12.5a7 7 0 0 1-14 0c0-4 4-8 7-12.5z' fill='%2366c1f5' stroke='%232a78b0' stroke-width='1.6'/><path d='M8.5 15a4 4 0 0 0 2 3' stroke='%23fff' stroke-width='2' stroke-linecap='round'/></svg>")}
.ic.lock{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='4' y='10' width='16' height='11' rx='2.5' fill='%23ffc83d' stroke='%23a06400' stroke-width='1.6'/><path d='M8 10V7a4 4 0 0 1 8 0v3' fill='none' stroke='%23a06400' stroke-width='2.4' stroke-linecap='round'/><circle cx='12' cy='15.5' r='1.8' fill='%23a06400'/></svg>")}
.ic.cash{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='2' y='6' width='20' height='12' rx='2' fill='%2355c35a' stroke='%231f6b25' stroke-width='1.6'/><circle cx='12' cy='12' r='3' fill='%23c8f5c0' stroke='%231f6b25' stroke-width='1.3'/></svg>")}
.ic.up{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 3l8 8.5h-5V20H9v-8.5H4z' fill='%23fff' stroke='%23a06400' stroke-width='1.8' stroke-linejoin='round'/></svg>")}
.ic.gear{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2.5l2 2.2 2.9-.7.9 2.8 2.8.9-.7 2.9 2.2 2-2.2 2 .7 2.9-2.8.9-.9 2.8-2.9-.7-2 2.2-2-2.2-2.9.7-.9-2.8-2.8-.9.7-2.9-2.2-2 2.2-2-.7-2.9 2.8-.9.9-2.8 2.9.7z' fill='%23dbe6ff' stroke='%236b84b8' stroke-width='1.4' stroke-linejoin='round'/><circle cx='12' cy='12' r='3.2' fill='%231b2740'/></svg>")}
.ic.heart{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z' fill='%23ff6b8a' stroke='%23b8294a' stroke-width='1.6' stroke-linejoin='round'/></svg>")}
.ic.angry{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M4 4l5 2M20 4l-5 2M12 3v4M4 20l5-2M20 20l-5-2M12 21v-4' stroke='%23e03a3a' stroke-width='2.6' stroke-linecap='round'/></svg>")}
/* ---- 월드 라벨 (키 기반 DOM, transform 배치) ---- */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
#labels>div{position:absolute;left:0;top:0;will-change:transform}
#labels>div>div{transform:translate(-50%,-100%);white-space:nowrap}
.rc{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.96);border:2px solid #2b3a55;border-radius:14px;padding:2px 8px 2px 5px;font-size:12.5px;font-weight:900;color:#1b2740;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.rc .ic{width:16px;height:16px}
.rc.full{border-color:#ff5a3c}
.rc .mx{background:#ff5a3c;color:#fff;border-radius:8px;padding:0 5px;font-size:11px;margin-left:2px;line-height:14px;animation:bounce .5s}
.rc.cash{background:#e6ffd9;border-color:#2e7d32;color:#1b5e20}
.pulse{animation:pulse .32s}
@keyframes pulse{0%{transform:translate(-50%,-100%) scale(1)}40%{transform:translate(-50%,-100%) scale(1.2)}100%{transform:translate(-50%,-100%) scale(1)}}
@keyframes bounce{0%{transform:scale(.3)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
.bub{background:#fff;border:2px solid #2b3a55;padding:3px 9px;font-size:13px;border-radius:12px;font-weight:900;color:#1b2740;display:flex;align-items:center;gap:3px;position:relative}
.bub::after{content:"";position:absolute;left:50%;top:100%;margin-left:-5px;border:5px solid transparent;border-top-color:#2b3a55}
.bub.hot{background:#ffe3dc;border-color:#c23b2a}
.bub .ic{width:15px;height:15px}
.sg{background:rgba(21,33,58,.9);border:2px solid #4a6190;color:#fff;padding:2px 7px 3px;font-size:11px;font-weight:800;border-radius:9px;display:flex;flex-direction:column;align-items:center;line-height:1.15;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.sg b{font-weight:900;font-size:12px;color:#ffd45a;display:flex;align-items:center;gap:2px}.sg b .ic{width:13px;height:13px}
.sg.ok{background:#ffd54a;border-color:#fff2b0;color:#3a2200;box-shadow:0 2px 0 #8a5200,0 0 0 3px rgba(255,213,74,.4)}.sg.ok b{color:#3a2200}
.sg.gate{flex-direction:row;gap:4px;background:linear-gradient(#55a9ff,#1f63d6);border-color:#a9d6ff;color:#fff;border-radius:10px;padding:3px 10px;font-size:12.5px;box-shadow:0 2px 0 var(--blueD);-webkit-text-stroke:3px var(--blueD);paint-order:stroke fill}.sg.gate b{color:#fff;font-size:12.5px}
.sg.gate.ok{background:linear-gradient(#ffd45a,#f0a428);border-color:#fff0b8;box-shadow:0 2px 0 var(--goldD),0 0 0 3px rgba(255,213,74,.35);-webkit-text-stroke-color:#8a5200}.sg.gate.ok b{color:#fff}
.nm{background:rgba(21,33,58,.85);color:#fff;padding:1px 7px;font-size:11.5px;font-weight:800;border-radius:8px;border:1.5px solid var(--line)}
.fl{font-weight:900;font-size:17px;color:#fff;-webkit-text-stroke:4px #1b2740;paint-order:stroke fill;display:flex;align-items:center;gap:2px}
.fl.gold{color:#ffd45a}
.fl .ic{width:16px;height:16px}
/* ---- HUD ---- */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(8px + var(--sat)) 10px 0;display:flex;gap:6px;align-items:center;pointer-events:none;z-index:2}
.pill{display:flex;align-items:center;gap:5px;background:rgba(21,33,58,.86);border:2px solid var(--line);border-radius:20px;padding:4px 11px 4px 6px;color:#fff;font-size:14px;font-weight:900;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.3);transition:transform .12s}
.pill .ic{width:20px;height:20px}
.pill.flash{transform:scale(1.12)}
#bells{font-size:16px;color:var(--gold)}
#gear{margin-left:auto;pointer-events:auto;cursor:pointer;width:38px;height:38px;border-radius:50%;justify-content:center;padding:0}
#gear .ic{width:22px;height:22px}
#bottom{position:fixed;left:0;right:0;bottom:calc(12px + var(--sab));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:2;pointer-events:none;padding:0 12px}
#hint{background:rgba(21,33,58,.86);color:#fff;padding:5px 13px;font-size:12.5px;font-weight:800;border-radius:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:opacity .3s;border:1.5px solid var(--line)}
#hint:empty{opacity:0}
#bar{display:flex;align-items:center;gap:10px;width:100%;max-width:430px}
#banner{flex:1;pointer-events:auto;cursor:pointer;background:linear-gradient(#5fb0ff,#2470e8 55%,#1a5bd0);border:3px solid #a9d6ff;border-radius:16px;padding:8px 14px 9px;box-shadow:0 4px 0 var(--blueD),0 8px 14px rgba(0,0,0,.3);color:#fff;text-align:center;min-height:58px;display:flex;flex-direction:column;justify-content:center;gap:2px;transition:transform .1s}
#banner:active{transform:translateY(2px)}
#banner.ok{animation:glow 1.2s infinite}
@keyframes glow{0%,100%{box-shadow:0 4px 0 var(--blueD),0 8px 14px rgba(0,0,0,.3)}50%{box-shadow:0 4px 0 var(--blueD),0 0 0 5px rgba(255,213,74,.55)}}
.bt{font-size:18px;font-weight:900;letter-spacing:.01em;-webkit-text-stroke:4px var(--blueD);paint-order:stroke fill;line-height:1.2}
.bs{font-size:12.5px;font-weight:800;-webkit-text-stroke:3px var(--blueD);paint-order:stroke fill;display:flex;justify-content:center;align-items:center;gap:3px}
.bpw{height:7px;background:rgba(10,30,80,.55);border-radius:4px;margin-top:4px;overflow:hidden;border:1px solid rgba(255,255,255,.25)}
#bp{height:100%;width:0;background:linear-gradient(#ffe58a,#f0a428);border-radius:4px;transition:width .3s}
#upBtn{pointer-events:auto;cursor:pointer;touch-action:none;width:66px;height:66px;border-radius:50%;background:linear-gradient(#ffd45a,#f2a92a 60%,#e08f12);border:3px solid #fff0b8;box-shadow:0 4px 0 var(--goldD),0 8px 14px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:900;-webkit-text-stroke:3px #8a5200;paint-order:stroke fill;position:relative;flex:none;transition:transform .1s}
#upBtn .ic{width:26px;height:26px;margin-bottom:-2px}
#upBtn:active{transform:translateY(2px)}
#upBtn .dot{position:absolute;top:-1px;right:-1px;width:18px;height:18px;border-radius:50%;background:#ff4d4d;border:2px solid #fff;display:none}
#upBtn.has .dot{display:block;animation:bounce .5s}
#joy{position:fixed;left:0;top:0;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.45);display:none;pointer-events:none;transform:translate(-60px,-60px);z-index:3}
#joy.on{display:block}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fff;border:3px solid var(--line);box-shadow:0 3px 0 rgba(0,0,0,.3)}
/* ---- 시트 / 모달 ---- */
.scrim{position:fixed;inset:0;background:rgba(10,16,30,.5);display:none;z-index:10}.scrim.on{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;background:#1b2740;border-top:3px solid var(--line);border-radius:22px 22px 0 0;max-height:74vh;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.3,1.15);z-index:11;padding:12px 12px calc(12px + var(--sab));display:flex;flex-direction:column;color:#fff}
#sheet.on{transform:none}
#sheet h2{margin:0 0 10px;font-size:19px;text-align:center;letter-spacing:.04em;font-weight:900;color:var(--gold);-webkit-text-stroke:3.5px #0f1a30;paint-order:stroke fill;display:flex;align-items:center;justify-content:center;gap:6px}
#sheet h2 .ic{width:22px;height:22px}
#rows{overflow-y:auto;display:flex;flex-direction:column;gap:7px;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.row{display:flex;align-items:center;gap:10px;background:#263858;border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.row.lock{opacity:.6}.row.done{background:#20304c}
.row .ico{width:42px;height:42px;border-radius:12px;background:var(--navy);display:flex;align-items:center;justify-content:center;font-size:23px;flex:none;border:2px solid var(--line)}
.row .info{flex:1;min-width:0}
.row .nm2{font-size:14px;font-weight:900;display:flex;align-items:center;gap:6px}
.row .lv{font-size:11px;background:var(--navy);padding:1px 6px;border-radius:7px;color:#ffe58a}
.row .ds{font-size:11px;color:#a9b8d6;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:3px;margin-top:5px}.pips i{width:13px;height:6px;border-radius:3px;background:#3b4f7a}.pips i.on{background:var(--gold)}
.buy{flex:none;min-width:84px;padding:8px 10px;border-radius:12px;border:2px solid #a9d6ff;background:linear-gradient(#55a9ff,#1f63d6);color:#fff;font:inherit;font-size:13px;font-weight:900;box-shadow:0 3px 0 var(--blueD);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;-webkit-text-stroke:3px var(--blueD);paint-order:stroke fill}
.buy .ic{width:15px;height:15px}
.buy:active{transform:translateY(2px);box-shadow:none}
.buy:disabled{background:#3b4a66;border-color:#55668a;box-shadow:0 3px 0 #1b2740;color:#c3cfe6;cursor:default;-webkit-text-stroke-color:#1b2740;font-size:11.5px}
.buy.max{background:linear-gradient(#ffd45a,#e08f12);border-color:#fff0b8;box-shadow:0 3px 0 var(--goldD);color:#fff;-webkit-text-stroke-color:#8a5200;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(10,16,30,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.on{display:flex}
.box{background:#1b2740;border:3px solid var(--line);border-radius:20px;padding:0 0 16px;width:100%;max-width:360px;box-shadow:0 12px 30px rgba(0,0,0,.45);color:#fff;overflow:hidden}
.box h1,.box h2{margin:0 0 12px;padding:12px 16px;background:linear-gradient(#5fb0ff,#1f5fd0);font-size:20px;text-align:center;letter-spacing:.04em;font-weight:900;-webkit-text-stroke:4px var(--blueD);paint-order:stroke fill;border-bottom:3px solid #a9d6ff}
.box p{margin:0 16px 12px;font-size:13.5px;color:#c9d6ef;line-height:1.65}
.box .big{font-size:34px;font-weight:900;text-align:center;margin:8px 0 14px;color:var(--gold);-webkit-text-stroke:5px #0f1a30;paint-order:stroke fill;display:flex;align-items:center;justify-content:center;gap:6px}
.box .big .ic{width:34px;height:34px}
.btn{display:block;width:calc(100% - 32px);margin:8px 16px 0;background:linear-gradient(#ffd45a,#f0a428 60%,#e08f12);color:#fff;border:3px solid #fff0b8;border-radius:14px;padding:12px;font:inherit;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 var(--goldD);-webkit-text-stroke:3.5px #8a5200;paint-order:stroke fill}
.btn.b{background:linear-gradient(#55a9ff,#1f63d6);border-color:#a9d6ff;box-shadow:0 4px 0 var(--blueD);-webkit-text-stroke-color:var(--blueD)}
.btn.g{background:#2b3c5e;border-color:#4a6190;box-shadow:0 4px 0 var(--navy);-webkit-text-stroke-color:var(--navy)}
.btn:active{transform:translateY(3px);box-shadow:none}
#sheet .btn{width:100%;margin:10px 0 0}
#toast{position:fixed;left:50%;top:calc(60px + var(--sat));transform:translateX(-50%);background:rgba(21,33,58,.92);border:2px solid var(--gold);box-shadow:0 3px 0 rgba(0,0,0,.3);padding:7px 16px;font-size:13.5px;font-weight:900;color:#fff;opacity:0;transition:opacity .25s,transform .25s;z-index:4;pointer-events:none;white-space:nowrap;border-radius:14px}
#toast.on{opacity:1;transform:translateX(-50%) translateY(4px)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;letter-spacing:.1em;z-index:30;background:#c9552b}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="loading">가게 여는 중…</div>
<div id="hud">
  <div class="pill" id="bells"><i class="ic bell"></i><span id="bellsN">0</span></div>
  <div class="pill"><i class="ic bottle"></i><span id="shelfN">0/8</span></div>
  <div class="pill"><i class="ic drop"></i><span id="waterN">0</span></div>
  <div class="pill" id="gear"><i class="ic gear"></i></div>
</div>
<div id="bottom">
  <div id="hint"></div>
  <div id="bar">
    <div id="banner"><div class="bt" id="bt">다음 목표</div><div class="bs" id="bs"></div><div class="bpw"><div id="bp"></div></div></div>
    <div id="upBtn"><i class="ic up"></i><span>업그레이드</span><div class="dot"></div></div>
  </div>
</div>
<div id="joy"><div id="knob"></div></div>
<div id="toast"></div>
<div class="scrim" id="scrim"></div>
<div id="sheet"><h2><i class="ic up"></i>업그레이드</h2><div id="rows"></div><button class="btn g" id="sheetClose">닫기</button></div>
<div class="modal on" id="intro"><div class="box"><h1>화성 물병 가게</h1><p>붉은 행성 정착지에 물병 가게를 열어요. 얼음을 녹여 물병을 만들고, 착륙선에서 내린 여행자에게 팔아 벨을 모아요.<br>벨로 구역의 게이트를 열고 시설을 키워 정착지를 넓혀요.<br><br>화면을 드래그하면 걸어요. 나머지는 가까이 가면 알아서 돼요.</p><button class="btn" id="start">가게 열기</button></div></div>
<div class="modal" id="offline"><div class="box"><h2>부재 중 장사</h2><p id="offtxt"></p><div class="big" id="offamt"></div><button class="btn" id="offok">받기</button></div></div>
<div class="modal" id="settings"><div class="box"><h2>설정</h2><p>드래그 = 걷기 · 가까이 가면 자동으로 줍고·넣고·팔아요 · 노란 발판에 서 있으면 벨이 들어가요 · 업그레이드 버튼으로도 살 수 있어요</p><button class="btn b" id="muteBtn">소리</button><button class="btn g" id="resetBtn">처음부터 다시</button><button class="btn" id="setClose">닫기</button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const easeOutBack=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}; // 배치용 고정 난수
/* ================= 월드 레이아웃 (논리 좌표: x 0..400, y 0..1040, y가 커질수록 화면 아래) ================= */
const W=400,H=1040;
const STN={
  melter:{x:322,y:124,w:96,h:64,name:'제빙기'},
  bottler:{x:322,y:304,w:96,h:64,name:'병입기'},
  counter:{x:178,y:504,w:220,h:36,name:'카운터'},

      const jump=c.jump!==undefined?Math.sin(c.jump/.5*Math.PI)*18:0;const bobc=c.moving?Math.abs(Math.sin(t/100+c.id))*2.5:(c.st==='queue'?Math.sin(t/450+c.id)*1:0);g.position.copy(W2T(c.x,c.y,jump+bobc));turnTo(g,yawOf(c.dir),dt);animPerson(g,!!c.moving,dt,t,c.id);c.moving=false;if(c.st==='sit')g.position.y-=4}
    for(const [id,g] of custG)if(!seen.has(id)){world.remove(g);custG.delete(id)}}
  // 먼지 토끼
  for(const h of hoppers){const an=h.g.userData.anim;const hop=h.moving?Math.abs(Math.sin(h.hop))*9:0;h.g.position.copy(W2T(h.x,h.y,hop));turnTo(h.g,yawOf(h.dir),dt);an.body.scale.y=.9*(h.moving?1+Math.cos(h.hop*2)*.08:1+Math.sin(t/400+an.ph)*.04);an.ears.forEach((e,i)=>e.rotation.z=(i?-1:1)*(.1+Math.sin(t/350+an.ph)*.12))}
  // 기계 상태
  {const m=stnG.melter;syncStack(m.userData.q,Array(Math.min(S.meltQ,5)).fill('ice'),'i'+Math.min(S.meltQ,5));setBar(m.userData.bar,S.meltQ>0?S.meltT/meltTime():0);
    const b=stnG.bottler;syncStack(b.userData.out,Array(S.bottles).fill('bottle'),'o'+S.bottles,i=>[-26+i*10,0,0]);setBar(b.userData.bar,S.water>=10?S.botT/bottleTime():0);b.userData.flag.rotation.y=Math.sin(t/300)*.25;stnG.counter.userData.flag.rotation.y=Math.sin(t/280+1)*.3;
    syncStack(stnG.counter.userData.shelf,Array(S.shelf).fill('bottle'),'s'+S.shelf,i=>[-84+(i%12)*15,0,-8+Math.floor(i/12)*14]);
    const n=S.cash>0?Math.min(12,Math.ceil(S.cash/12)):0;syncStack(stnG.register.userData.cash,Array(n).fill('bill'),'c'+n,i=>[(i%2)*17-8.5,Math.floor(i/2)*3.2,Math.sin(i*3)*1.5]);
    if(stnG.drill.visible){const u=stnG.drill.userData;u.drill.rotation.y+=.3;u.drill.position.y=28+Math.sin(t/120)*4;u.beacon.material.emissiveIntensity=.6+Math.sin(t/200)*.5}
    landerG.userData.beacon.material.emissiveIntensity=.6+Math.sin(t/300)*.5;if(landerG.userData.flag)landerG.userData.flag.rotation.y=Math.sin(t/260)*.35;
    const pt=penG.userData.tip;syncStack(pt,Array(S.penTip>0?Math.min(4,Math.ceil(S.penTip/15)):0).fill('coin'),'p'+Math.min(4,Math.ceil(S.penTip/15)),i=>[(i%2)*9-4.5,i>1?2:0,Math.floor(i/2)*9-4.5])}
  // 얼음
  iceG.forEach((g,i)=>{g.visible=spotOpen(i);g.userData.m.rotation.y=t/900+i;g.userData.m.position.y=11+Math.sin(t/500+i)*1.2});
  // 발판
  for(const [id,g] of padG){const {pd,ring,fill}=g.userData;const lv=padLv(id),vis=pd.req(S)&&lv<pd.max;g.visible=vis;if(!vis)continue;const cost=pd.cost(lv),prog=S.padProg[id]||0;const fs=Math.max(.001,Math.sqrt(prog/cost));fill.scale.set(fs,1,fs);const ok=S.bells>=cost-prog;ring.material=mat(ok?COL.gold:COL.cream,ok?{emissive:0xffd34d,emissiveIntensity:.3}:{});ring.scale.setScalar(ok?1+Math.sin(t/250)*.04:1)}
  // 힌트 화살표
  if(hintTarget){const p=S.p,dx=hintTarget.x-p.x,dy=hintTarget.y-p.y,L=Math.hypot(dx,dy);arrowG.visible=L>70;targetRing.visible=true;
    if(L>70){arrowG.position.copy(W2T(p.x+dx/L*30,p.y+dy/L*30,30+Math.sin(t/150)*3));arrowG.rotation.y=Math.atan2(dx,dy)}
    targetRing.position.copy(W2T(hintTarget.x,hintTarget.y,2));targetRing.scale.setScalar(1+Math.sin(t/200)*.08)}else{arrowG.visible=false;targetRing.visible=false}
  // 라벨 (HTML): 떠 있는 자원 카운터, 발판 팻말, 게이트, 말풍선, 이름표, 플로팅 텍스트
  lab('rc-melt','rc',`<i class="ic ice"></i>${S.meltQ}<span style="opacity:.35">|</span><i class="ic drop"></i>${Math.floor(S.water)}`,STN.melter.x-8,STN.melter.y,100+bob,true);
  lab('rc-bot','rc'+(S.bottles>=BOTTLE_CAP?' full':''),cnt('bottle',S.bottles,BOTTLE_CAP),STN.bottler.x-10,STN.bottler.y,92+bob,true);
  lab('rc-shelf','rc'+(S.shelf>=shelfCap()?' full':''),cnt('bottle',S.shelf,shelfCap()),STN.counter.x-40,STN.counter.y,122+bob,true);
  if(S.cash>0)lab('rc-cash','rc cash',`<i class="ic cash"></i>${S.cash}`,STN.register.x+36,STN.register.y+4,20+cashHeight()+bob,true);
  if(S.penTip>0&&padLv('pen'))lab('rc-pen','rc cash',`<i class="ic bell"></i>${S.penTip}`,PEN_TIP.x,PEN_TIP.y,26+bob,true);
  for(const k in ZONES){const z=ZONES[k];if(z.pad&&zoneOpen(k)){lab('zn-'+k,'nm',z.name,(z.x0+z.x1)/2,z.y0-4,26)}}
  for(const [id,g] of padG){if(!g.visible)continue;const pd=g.userData.pd,lv=padLv(id),cost=pd.cost(lv),prog=S.padProg[id]||0,ok=S.bells>=cost-prog;
    if(pd.zone){const a=zoneG[pd.zone].arch.position;lab('pad-'+id,'sg gate'+(ok?' ok':''),`<i class="ic lock"></i>${pd.sn} <b><i class="ic bell"></i>${Math.ceil(cost-prog)}</b>`,a.x+200,a.z+520,24,false,true)}
    else lab('pad-'+id,'sg'+(ok?' ok':''),`<span>${pd.sn}</span><b><i class="ic bell"></i>${Math.ceil(cost-prog)}</b>`,pd.x,pd.y+14,4)}
  for(const c of custs){if(c.st==='queue'||c.st==='walkin')lab('cu'+c.id,'bub'+(c.wait>25?' hot':''),`<i class="ic bottle"></i>×${c.want}`,c.x,c.y,72);else if(c.jump!==undefined)lab('cu'+c.id,'bub','<i class="ic heart"></i>',c.x,c.y,80)}
  for(const b of bots)lab('bt'+bots.indexOf(b),'nm',b.k==='cashier'?'삐걱':'뽀삐',b.x,b.y,72);
  for(const f of floats)lab('fl'+f.id,'fl'+(f.gold?' gold':''),f.txt,f.x,f.y,40+f.t*50);
  labFlush();tickDust(1/60,t);
  renderer.render(scene,camera)}
/* ================= 루프 ================= */
let last=0;function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(!$('#intro').classList.contains('on')){const n=window.dbg.steps||1;for(let i=0;i<n;i++){if(window.dbg.hook)window.dbg.hook();update(dt)}}else updateCamera();render(t);requestAnimationFrame(loop)}
/* ================= 시작 ================= */
function restoreBots(){for(const g of botG)world.remove(g);botG.length=0;bots=[];if(padLv('cashier'))spawnBot('cashier');if(padLv('runner'))spawnBot('runner',true);if(padLv('runner2'))spawnBot('runner',true);
  stnG.drill.visible=padLv('drill')>0;domeG.visible=padLv('dome')>0;penG.visible=padLv('pen')>0;if(padLv('pen'))spawnHoppers();else{for(const h of hoppers)world.remove(h.g);hoppers.length=0}
  for(const k in ZONES){const zg=zoneG[k];const open=zoneOpen(k);zg.g.visible=open;zg.g.scale.setScalar(1);if(zg.arch)zg.arch.userData.lock.visible=!open}
  ICE_SPOTS.forEach((_,i)=>{iceG[i].scale.setScalar(S.spots[i]>0?.001:1);iceG[i].visible=spotOpen(i)})}
if(blocked(S.p.x,S.p.y)){const f=fresh().p;S.p.x=f.x;S.p.y=f.y;S.p.dir=[0,1]} // 옛 배치의 저장 위치가 새 건물 안이면 갇히므로 시작 지점으로
restoreBots();renderHud();hint();cam.y=S.p.y;updateCamera();$('#loading').remove();
$('#start').onclick=()=>{$('#intro').classList.remove('on');sfx('up');offlineEarn()};
if(S.sold>0){$('#intro h1').textContent='다시 오셨군요';$('#intro p').innerHTML=`지금까지 물병 ${S.sold}개 판매 · <i class="ic bell"></i> ${Math.floor(S.bells)}`;$('#start').textContent='이어서 하기'}
$('#gear').onclick=()=>{$('#muteBtn').textContent=S.muted?'🔇 소리 꺼짐':'🔊 소리 켜짐';$('#settings').classList.add('on')};
$('#setClose').onclick=()=>$('#settings').classList.remove('on');
$('#muteBtn').onclick=()=>{S.muted=!S.muted;$('#muteBtn').textContent=S.muted?'🔇 소리 꺼짐':'🔊 소리 켜짐';save()};
let resetArm=0;$('#resetBtn').onclick=()=>{const b=$('#resetBtn');if(Date.now()-resetArm>4000){resetArm=Date.now();b.textContent='정말 처음부터? 다시 누르면 지워요';toast('다시 누르면 가게가 지워져요');setTimeout(()=>{b.textContent='처음부터 다시';resetArm=0},4000);return}b.textContent='처음부터 다시';resetArm=0;{localStorage.removeItem(KEY);S=fresh();for(const [id,g] of custG)world.remove(g);custG.clear();custs=[];seats.forEach(s=>{s.used=0;s.tip=0;s.mesh.visible=false});restoreBots();$('#settings').classList.remove('on');renderHud();save()}};
addEventListener('visibilitychange',()=>{if(document.hidden)save();else if(!$('#intro').classList.contains('on'))offlineEarn()});addEventListener('pagehide',save);
Object.defineProperties(window,{S:{get:()=>S},custs:{get:()=>custs},bots:{get:()=>bots},joyVec:{get:()=>joyVec,set:v=>{joyVec=v}}});
window.dbg={onPad,restoreBots,save,buyPad,unlockZone,openSheet,renderer};window.PADS=PADS;window.STN=STN;window.ICE_SPOTS=ICE_SPOTS;window.ZONES=ZONES;window.padLv=padLv;window.carryMax=carryMax;window.spotOpen=spotOpen;
requestAnimationFrame(loop);
</script>
