<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#c9552b">
<title>화성 물병 가게</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1210;--navy:#15213a;--navy2:#1f3157;--line:#3b4f7a;--edge:#0b1428;--blueD:#0f3f99;--gold:#ffd45a;--goldD:#a06400;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#c9552b}
body{font-family:"Jua",-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Helvetica Neue",sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;letter-spacing:.01em}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse 80% 70% at 50% 45%,rgba(0,0,0,0) 55%,rgba(40,8,0,.38) 100%)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:9;background:#fff8e0;opacity:0;transition:opacity .45s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
#fx i{position:absolute;left:0;top:0;will-change:transform}
#fx .fc{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc83d 55%,#c98a00);border:2px solid #7a4a00;box-shadow:0 2px 0 rgba(0,0,0,.35);margin:-11px 0 0 -11px}
#fx .cf{width:9px;height:14px;border-radius:2px;margin:-7px 0 0 -4px}
/* ---- 아이콘 (CSS SVG) ---- */
.ic{display:inline-block;width:14px;height:14px;background:center/contain no-repeat;vertical-align:-2px;flex:none;filter:drop-shadow(0 1.5px 0 rgba(0,0,0,.35))}
.ic.bell{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2a2 2 0 0 1 2 2v1a6 6 0 0 1 4 5.7V15l2 2v1H4v-1l2-2v-4.3A6 6 0 0 1 10 5V4a2 2 0 0 1 2-2z' fill='%23ffc83d' stroke='%23a06400' stroke-width='1.6' stroke-linejoin='round'/><circle cx='12' cy='20' r='2' fill='%23a06400'/></svg>")}
.ic.ice{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='3' y='3' width='18' height='18' rx='4' fill='%23bfe6ff' stroke='%235a9ccc' stroke-width='1.8'/><path d='M7 9l3-3M7 14l7-7' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/></svg>")}
.ic.bottle{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='9' y='1.5' width='6' height='4' rx='1' fill='%23274060'/><path d='M8 6h8v3l1.5 2v10.5a1.5 1.5 0 0 1-1.5 1.5H8a1.5 1.5 0 0 1-1.5-1.5V11L8 9z' fill='%2366c1f5' stroke='%232a78b0' stroke-width='1.6' stroke-linejoin='round'/><path d='M9.5 12v7' stroke='%23fff' stroke-width='2' stroke-linecap='round'/></svg>")}
.ic.drop{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2.5c3 4.5 7 8.5 7 12.5a7 7 0 0 1-14 0c0-4 4-8 7-12.5z' fill='%2366c1f5' stroke='%232a78b0' stroke-width='1.6'/><path d='M8.5 15a4 4 0 0 0 2 3' stroke='%23fff' stroke-width='2' stroke-linecap='round'/></svg>")}
.ic.lock{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='4' y='10' width='16' height='11' rx='2.5' fill='%23ffc83d' stroke='%23a06400' stroke-width='1.6'/><path d='M8 10V7a4 4 0 0 1 8 0v3' fill='none' stroke='%23a06400' stroke-width='2.4' stroke-linecap='round'/><circle cx='12' cy='15.5' r='1.8' fill='%23a06400'/></svg>")}
.ic.cash{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='2' y='6' width='20' height='12' rx='2' fill='%2355c35a' stroke='%231f6b25' stroke-width='1.6'/><circle cx='12' cy='12' r='3' fill='%23c8f5c0' stroke='%231f6b25' stroke-width='1.3'/></svg>")}
.ic.up{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 3l8 8.5h-5V20H9v-8.5H4z' fill='%23fff' stroke='%23a06400' stroke-width='1.8' stroke-linejoin='round'/></svg>")}
.ic.gear{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2.5l2 2.2 2.9-.7.9 2.8 2.8.9-.7 2.9 2.2 2-2.2 2 .7 2.9-2.8.9-.9 2.8-2.9-.7-2 2.2-2-2.2-2.9.7-.9-2.8-2.8-.9.7-2.9-2.2-2 2.2-2-.7-2.9 2.8-.9.9-2.8 2.9.7z' fill='%23dbe6ff' stroke='%236b84b8' stroke-width='1.4' stroke-linejoin='round'/><circle cx='12' cy='12' r='3.2' fill='%231b2740'/></svg>")}
.ic.heart{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z' fill='%23ff6b8a' stroke='%23b8294a' stroke-width='1.6' stroke-linejoin='round'/></svg>")}
.ic.angry{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M4 4l5 2M20 4l-5 2M12 3v4M4 20l5-2M20 20l-5-2M12 21v-4' stroke='%23e03a3a' stroke-width='2.6' stroke-linecap='round'/></svg>")}
.ic.flag{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M5 3v18' stroke='%23a06400' stroke-width='2.6' stroke-linecap='round'/><path d='M6 4h12l-3 4 3 4H6z' fill='%23ff6b5a' stroke='%23b8294a' stroke-width='1.6' stroke-linejoin='round'/></svg>")}
.ic.tchest{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='3' y='9' width='18' height='11' rx='2' fill='%23b5722f' stroke='%233a2208' stroke-width='1.6'/><path d='M3 10a9 5 0 0 1 18 0' fill='%23d49040' stroke='%233a2208' stroke-width='1.6'/><rect x='10' y='9' width='4' height='5' rx='1' fill='%23ffc83d' stroke='%23a06400' stroke-width='1.2'/></svg>")}
.ic.crown{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M3 18l1-11 5 5 3-7 3 7 5-5 1 11z' fill='%23ffc83d' stroke='%23a06400' stroke-width='1.6' stroke-linejoin='round'/><rect x='3' y='17' width='18' height='4' rx='1' fill='%23ffe27a' stroke='%23a06400' stroke-width='1.4'/></svg>")}
.ic.zz{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M4 8h8l-8 9h8' fill='none' stroke='%235a7bd6' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'/><path d='M14 4h6l-6 6h6' fill='none' stroke='%235a7bd6' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'/></svg>")}
.ic.shelf{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='5' y='3' width='3' height='6' rx='.8' fill='%2366c1f5' stroke='%232a78b0' stroke-width='1'/><rect x='10.5' y='3' width='3' height='6' rx='.8' fill='%2366c1f5' stroke='%232a78b0' stroke-width='1'/><rect x='16' y='3' width='3' height='6' rx='.8' fill='%2366c1f5' stroke='%232a78b0' stroke-width='1'/><rect x='2' y='9' width='20' height='3' rx='1' fill='%23c07a32' stroke='%233a2208' stroke-width='1.4'/><rect x='5' y='13' width='3' height='6' rx='.8' fill='%2366c1f5' stroke='%232a78b0' stroke-width='1'/><rect x='10.5' y='13' width='3' height='6' rx='.8' fill='%2366c1f5' stroke='%232a78b0' stroke-width='1'/><rect x='2' y='19' width='20' height='3' rx='1' fill='%23c07a32' stroke='%233a2208' stroke-width='1.4'/></svg>")}
.ic.arrow{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M4 12h13M12 6l6 6-6 6' fill='none' stroke='%232b3a55' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/></svg>")}
.ic.bang{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 3v11' stroke='%23e03a3a' stroke-width='4.5' stroke-linecap='round'/><circle cx='12' cy='19.5' r='2.4' fill='%23e03a3a'/></svg>")}
/* ---- 월드 라벨 (키 기반 DOM, transform 배치) ---- */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
#labels>div{position:absolute;left:0;top:0;will-change:transform}
#labels>div>div{transform:translate(-50%,-100%);white-space:nowrap}
.rc{display:flex;align-items:center;gap:4px;background:linear-gradient(#fff,#f1e8dc);border:2.5px solid #2b3a55;border-radius:14px;padding:2px 8px 2px 5px;font-size:13px;color:#1b2740;box-shadow:0 3px 0 rgba(0,0,0,.3),inset 0 1px 0 #fff}
.rc .ic{width:16px;height:16px}
.rc.full{border-color:#ff5a3c}
.rc .mx{background:#ff5a3c;color:#fff;border-radius:8px;padding:0 5px;font-size:11px;margin-left:2px;line-height:14px;animation:bounce .5s}
.rc.cash{background:linear-gradient(#f0ffe8,#d4f5c6);border-color:#2e7d32;color:#1b5e20}
.pulse{animation:pulse .32s}
@keyframes pulse{0%{transform:translate(-50%,-100%) scale(1)}40%{transform:translate(-50%,-100%) scale(1.2)}100%{transform:translate(-50%,-100%) scale(1)}}
@keyframes bounce{0%{transform:scale(.3)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes bubIn{0%{transform:translate(-50%,-100%) scale(.2)}55%{transform:translate(-50%,-100%) scale(1.25)}80%{transform:translate(-50%,-100%) scale(.92)}100%{transform:translate(-50%,-100%) scale(1)}}
@keyframes wob{0%,100%{transform:translate(-50%,-100%) rotate(-8deg)}50%{transform:translate(-50%,-100%) rotate(8deg)}}
@keyframes zz{0%,100%{transform:translate(-50%,-100%) translateY(0) scale(1)}50%{transform:translate(-50%,-100%) translateY(-6px) scale(1.1)}}
.bub{background:#fff;border:2.5px solid #2b3a55;padding:3px 10px;font-size:15px;border-radius:14px;color:#1b2740;display:flex;align-items:center;gap:3px;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.3);animation:bubIn .4s cubic-bezier(.2,1.2,.4,1)}
.bub::after{content:"";position:absolute;left:50%;top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:#2b3a55}
.bub.hot{background:#ffe3dc;border-color:#c23b2a;animation:wob .35s infinite}
.bub.side{font-size:15px;padding:2px 9px}.bub.side::after{left:100%;top:50%;margin:-6px 0 0 0;border:6px solid transparent;border-left-color:#2b3a55}
.bub.love{background:#fff0f4;border-color:#d64a6a;padding:4px 9px;animation:bubIn .5s cubic-bezier(.2,1.6,.4,1)}
.bub.love .ic{width:22px;height:22px}
.bub.zz{background:#eef3ff;border-color:#5a7bd6;animation:zz 1.4s infinite}
.bub.vip{background:linear-gradient(#fff3b0,#ffd45a);border-color:#8a5200;color:#5a3200}
.bub .ic{width:18px;height:18px}
.bub.pay::before{content:"";position:absolute;inset:-6px;border-radius:19px;padding:3.5px;background:conic-gradient(#ffd45a var(--p,0%),transparent 0);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.bub.rush b{color:#e03a3a}
@keyframes tipBob{0%,100%{transform:translate(-50%,-100%) translateY(0)}50%{transform:translate(-50%,-100%) translateY(-5px)}}
.bub.tip{background:linear-gradient(#fff,#fff3c4);border-color:#7a4a00;color:#3a2200;font-size:17px;padding:6px 14px 7px;border-radius:16px;animation:tipBob 1.3s ease-in-out infinite}.bub.tip::after{border-top-color:#7a4a00}
.bub.ico{padding:5px 10px;gap:5px}.bub.ico .ic{width:24px;height:24px}.bub.ico .ic.arrow{width:15px;height:15px;opacity:.7}.bub.ico .em{font-size:21px;line-height:1}
.sg{background:linear-gradient(#2a3d63,#15213a);border:2.5px solid #0f1a30;color:#fff;padding:3px 10px 4px;font-size:15px;border-radius:10px;display:flex;flex-direction:column;align-items:center;line-height:1.15;box-shadow:0 3px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.2)}
.sg b{font-weight:400;font-size:15px;color:#ffd45a;display:flex;align-items:center;gap:2px}.sg b .ic{width:16px;height:16px}.sg .em{font-size:20px;line-height:1.1;filter:drop-shadow(0 1px 0 rgba(0,0,0,.4))}.sg.gate .em{font-size:18px;-webkit-text-stroke:0}
.sg.ok{background:linear-gradient(#ffe58a,#f2b533);border-color:#7a4a00;color:#3a2200;box-shadow:0 3px 0 #8a5200,0 0 0 3px rgba(255,213,74,.4),inset 0 1px 0 rgba(255,255,255,.5)}.sg.ok b{color:#3a2200}
.sg.gate{flex-direction:row;gap:4px;background:linear-gradient(#55a9ff,#1f63d6);border-color:#0b2f80;color:#fff;border-radius:12px;padding:3px 10px 4px;font-size:15px;box-shadow:0 3px 0 var(--blueD),inset 0 1px 0 rgba(255,255,255,.35);-webkit-text-stroke:3px var(--blueD);paint-order:stroke fill}.sg.gate b{color:#fff;font-size:15px}
.sg.gate.ok{background:linear-gradient(#ffd45a,#f0a428);border-color:#7a4a00;box-shadow:0 3px 0 var(--goldD),0 0 0 3px rgba(255,213,74,.35),inset 0 1px 0 rgba(255,255,255,.5);-webkit-text-stroke-color:#8a5200}.sg.gate.ok b{color:#fff}
.nm{background:rgba(21,33,58,.88);color:#fff;padding:1px 8px 2px;font-size:11.5px;border-radius:9px;border:2px solid #0f1a30;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.nm.vip{background:linear-gradient(#ffe58a,#f2b533);color:#5a3200;border-color:#7a4a00;display:flex;align-items:center;gap:2px}
@keyframes flUp{0%{transform:translate(-50%,-100%) scale(.3)}30%{transform:translate(-50%,-100%) scale(1.4)}55%{transform:translate(-50%,-100%) scale(.95)}100%{transform:translate(-50%,-100%) scale(1)}}
.fl{font-size:19px;color:#fff;-webkit-text-stroke:5px #1b2740;paint-order:stroke fill;display:flex;align-items:center;gap:2px;animation:flUp .5s cubic-bezier(.2,1.2,.4,1)}
.fl.gold{color:#ffd45a}.fl.big{font-size:26px;color:#ffe58a;-webkit-text-stroke:6px #7a3a00}
.fl .ic{width:18px;height:18px}
/* ---- 공용 패널·버튼 (베벨) ---- */
.pnl{background:linear-gradient(#2c416b,#1a2844 60%,#16213a);border:3px solid var(--edge);border-radius:18px;box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.35),0 4px 0 #070d1a,0 8px 16px rgba(0,0,0,.35)}
.btn{display:block;width:calc(100% - 32px);min-height:52px;margin:8px 16px 0;background:linear-gradient(#ffe58a,#f4b02e 55%,#e08f12);color:#fff;border:3px solid #7a4a00;border-radius:16px;padding:12px;font:inherit;font-size:17px;cursor:pointer;box-shadow:0 5px 0 #7a4a00,inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.15);-webkit-text-stroke:4px #8a5200;paint-order:stroke fill;transition:transform .08s;letter-spacing:.03em}
.btn.b{background:linear-gradient(#7cc0ff,#2a74e8 55%,#1a5bd0);border-color:#0b2f80;box-shadow:0 5px 0 #0b2f80,inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.15);-webkit-text-stroke-color:var(--blueD)}
.btn.g{background:linear-gradient(#4a6190,#2b3c5e);border-color:#0b1428;box-shadow:0 5px 0 #0b1428,inset 0 2px 0 rgba(255,255,255,.2),inset 0 -3px 0 rgba(0,0,0,.2);-webkit-text-stroke-color:var(--navy)}
.btn.r{background:linear-gradient(#ff8a7a,#e04a3a 55%,#c0302a);border-color:#6a1410;box-shadow:0 5px 0 #6a1410,inset 0 2px 0 rgba(255,255,255,.4);-webkit-text-stroke-color:#8a1a10}
.btn:active,.buy:active,#upBtn:active,#gear:active,.tab:active{transform:scale(.93)}
/* ---- HUD ---- */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(8px + var(--sat)) 10px 0;display:flex;gap:6px;align-items:center;pointer-events:none;z-index:2}
.pill{display:flex;align-items:center;gap:5px;background:linear-gradient(#34508a,#1a2a4c 55%,#15213a);border:3px solid var(--edge);border-radius:22px;padding:2px 12px 2px 6px;min-height:44px;color:#fff;font-size:16px;white-space:nowrap;box-shadow:0 3px 0 #070d1a,inset 0 2px 0 rgba(255,255,255,.22),inset 0 -2px 0 rgba(0,0,0,.3);transition:transform .12s;-webkit-text-stroke:3px #0b1428;paint-order:stroke fill}
.pill .ic{width:22px;height:22px}
.pill.flash{transform:scale(1.12)}
@keyframes punch{0%{transform:scale(1)}30%{transform:scale(1.45)}100%{transform:scale(1)}}
.punch{animation:punch .32s cubic-bezier(.2,1.4,.4,1);display:inline-block}
#bells{font-size:20px;color:var(--gold)}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
#bells.shakeX{animation:shakeX .4s;border-color:#ff5a3c}
#gear{margin-left:auto;pointer-events:auto;cursor:pointer;width:44px;height:44px;border-radius:50%;justify-content:center;padding:0;transition:transform .08s}
#gear .ic{width:24px;height:24px}
#qchip{position:fixed;left:50%;top:calc(60px + var(--sat));transform:translateX(-50%);z-index:2;pointer-events:auto;cursor:pointer;min-height:40px;display:flex;align-items:center;gap:6px;background:linear-gradient(#2c416b,#16213a);border:2.5px solid var(--edge);border-radius:14px;padding:3px 10px 4px 8px;font-size:12.5px;color:#fff;box-shadow:0 3px 0 #070d1a,inset 0 1px 0 rgba(255,255,255,.2);max-width:calc(100% - 24px);white-space:nowrap;transition:opacity .3s}
#qchip .ic{width:20px;height:20px}#qchip b{font-weight:400;color:#ffd45a;font-size:15px}#qchip .em{font-size:19px;line-height:1;filter:drop-shadow(0 1px 0 rgba(0,0,0,.4))}#qchip:active{transform:translateX(-50%) scale(.95)}
#qchip .qb{width:46px;height:8px;background:#0b1428;border-radius:4px;overflow:hidden;border:1px solid #0b1428}#qchip .qb i{display:block;height:100%;background:linear-gradient(#ffe58a,#f0a428);width:0;transition:width .3s}
#qchip.done{background:linear-gradient(#ffe58a,#f2b533);color:#3a2200;border-color:#7a4a00}#qchip.done b{color:#3a2200}
#rush{position:fixed;left:50%;top:calc(106px + var(--sat));transform:translateX(-50%) scale(0);z-index:3;pointer-events:none;background:linear-gradient(#ff8a7a,#e04a3a 55%,#c0302a);border:3px solid #6a1410;border-radius:16px;padding:4px 16px 6px;font-size:17px;color:#fff;-webkit-text-stroke:4px #8a1a10;paint-order:stroke fill;box-shadow:0 4px 0 #6a1410,inset 0 2px 0 rgba(255,255,255,.4);transition:transform .3s cubic-bezier(.2,1.4,.4,1);white-space:nowrap;display:flex;align-items:center;gap:4px}
#rush .ic{width:22px;height:22px}
#rush.on{transform:translateX(-50%) scale(1);animation:rushGlow .5s infinite alternate}
@keyframes rushGlow{0%{box-shadow:0 4px 0 #6a1410,0 0 0 0 rgba(255,120,80,.0)}100%{box-shadow:0 4px 0 #6a1410,0 0 0 8px rgba(255,120,80,.45)}}
#combo{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(0);z-index:3;pointer-events:none;font-size:40px;color:#ffe58a;-webkit-text-stroke:8px #7a3a00;paint-order:stroke fill;text-align:center;line-height:1;white-space:nowrap;filter:drop-shadow(0 5px 0 rgba(0,0,0,.4))}
#combo.on{animation:comboPop .7s cubic-bezier(.2,1.4,.4,1) forwards}
